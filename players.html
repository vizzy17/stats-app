<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TNF Players</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h2>Players</h2>

  <!-- Example: player selection stored in sessionStorage elsewhere -->
  <button id="openReportModal" class="reportBtn">Report Goals / Assists</button>
  <button id="openConfirmModal" class="confirmBtn">Confirm Reports</button>

  <!-- REPORT MODAL -->
  <div id="reportModal" class="modal">
    <div class="modalContent">
      <h3>Report Your Goals / Assists</h3>

      <label>Your Name</label>
      <input type="text" id="reportPlayerName" readonly>

      <label>Goals Scored</label>
      <input type="number" id="reportGoals" min="0" value="0">

      <label>Assists Made</label>
      <input type="number" id="reportAssists" min="0" value="0">

      <label>Confirming Player</label>
      <select id="reportConfirmBy"></select>

      <label>Your PIN</label>
      <input type="password" id="reportPIN" maxlength="4">

      <button id="submitReportBtn" class="submitBtn">Submit Report</button>
      <button id="closeReportModal" class="closeBtn">Cancel</button>
    </div>
  </div>

  <!-- CONFIRMATION MODAL -->
  <div id="confirmModal" class="modal">
    <div class="modalContent">
      <h3>Confirm Goal / Assist Reports</h3>

      <div id="confirmList"></div>

      <button id="closeConfirmModal" class="closeBtn">Close</button>
    </div>
  </div>

  <script src="scripts/common.js"></script>
  <script src="scripts/players.js"></script>

</body>
</html>
