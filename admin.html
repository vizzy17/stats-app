<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TNF Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ADMIN LOGIN -->
  <div id="adminLoginScreen" style="padding:20px;">
    <h2>Admin Login</h2>
    <p>Enter Admin Passcode:</p>
    <input type="password" id="adminPasscode" maxlength="20" style="padding:10px;width:200px;">
    <button id="adminLoginBtn" class="adminBtn">Login</button>
    <div id="adminLoginStatus" style="margin-top:10px;color:red;"></div>
  </div>

  <!-- ADMIN CONTENT (HIDDEN UNTIL LOGIN) -->
  <div id="adminContent" style="display:none;">

    <h2>TNF Admin Page</h2>

    <h3>Security Tools</h3>
    <button id="generatePinsBtn" class="adminBtn">Generate PINs for All Players</button>

    <h3>Payments Log</h3>
    <div id="paymentsLog"></div>

    <h3>Upload Receipt</h3>
    <input type="text" id="receiptPlayer" placeholder="Player name">
    <input type="number" id="receiptAmount" placeholder="Amount">
    <input type="file" id="receiptFile" style="display:none;">
    <button id="chooseFileBtn" class="adminBtn">Choose File</button>
    <button id="uploadReceiptBtn" class="adminBtn">Upload Receipt</button>
    <div id="receiptStatus"></div>

    <h3>Release Slot</h3>
    <input type="text" id="releasePlayer" placeholder="Player name">
    <button id="releaseBtn" class="adminBtn">Release Player</button>
    <div id="releaseStatus"></div>

    <h3>Selected Teams</h3>
    <button id="publishSelectedBtn" class="adminBtn">Toggle Publish Selected Teams</button>
    <div id="selectedTeamsPreview"></div>

    <h3>Pending Goal/Assist Reports (Admin Approval)</h3>
    <div id="adminReportsArea" class="adminReportsBox"></div>
    <button id="approveReportBtn" class="adminBtn">Approve Selected Report</button>
    <button id="rejectReportBtn" class="adminBtn dangerBtn">Reject Selected Report</button>

  </div>

  <script src="scripts/common.js"></script>
  <script src="scripts/admin.js"></script>

</body>
</html>
